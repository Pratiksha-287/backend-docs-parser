spring.application.name=api-documentation-generator

server.port=8082

# Multipart file upload limits (used by /generate/file)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Generated documentation storage
documentation.storage.directory=./generated

# Maximum size of a specification (bytes) fetched from a URL or uploaded
documentation.source.max-size-bytes=10485760

# External source HTTP configuration
documentation.source.connect-timeout-seconds=10
documentation.source.read-timeout-seconds=30

# OpenAPI parser configuration
# false keeps $ref entries intact (required for schema relationships)
documentation.parser.resolve-references=false

# Output size
# false = compact single-line JSON (about 30% smaller than pretty printed)
documentation.output.pretty=true
# true = also embed the full parsed specification (roughly doubles the size)
documentation.output.include-original=false
