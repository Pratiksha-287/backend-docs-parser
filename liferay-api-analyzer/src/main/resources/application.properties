spring.application.name=liferay-api-analyzer
server.port=8082

# ---------------------------------------------------------------
# Liferay connection
# ---------------------------------------------------------------
liferay.base-url=${LIFERAY_BASE_URL:http://localhost:8080}

# OAuth 2.0 client credentials (recommended).
# Create an OAuth 2 application in Liferay (Control Panel > Security >
# OAuth 2 Administration), enable the "Client Credentials" grant, choose a
# "Client Credentials User" and grant the scopes you need.
liferay.oauth2.client-id=${LIFERAY_CLIENT_ID:}
liferay.oauth2.client-secret=${LIFERAY_CLIENT_SECRET:}
liferay.oauth2.token-path=${LIFERAY_TOKEN_PATH:/o/oauth2/token}
# Optional, space separated. Blank = every scope granted to the application.
liferay.oauth2.scope=${LIFERAY_OAUTH2_SCOPE:}
# "post" = client_id/client_secret in the form body, "basic" = Basic header
liferay.oauth2.client-authentication=${LIFERAY_CLIENT_AUTHENTICATION:post}

# Legacy HTTP Basic auth. Only used when liferay.oauth2.client-id is blank.
liferay.username=${LIFERAY_USERNAME:}
liferay.password=${LIFERAY_PASSWORD:}

# API discovery
liferay.discovery.catalog-path=/o/openapi/openapi.json

# Request timeout
liferay.request-timeout=300s

# Maximum response buffer size: 20 MB
liferay.max-in-memory-size=20971520

# ---------------------------------------------------------------
# Documentation output
# ---------------------------------------------------------------
documentation.storage.directory=./generated
# Indented JSON is much bigger; keep false unless you read it by hand.
documentation.output.pretty-print=true
# Also write a gzip copy next to each timestamped JSON file.
documentation.output.gzip=false

# Logging
logging.level.com.gupta.liferayanalyzer=DEBUG
