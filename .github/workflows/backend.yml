name: Pipeline 2 - Backend Docs Generator

on:
  # schedule:
  #   - cron: '30 18 * * *' # Testing ke baad uncomment kar lena
  workflow_dispatch:

concurrency:
  group: pipeline-2-backend
  cancel-in-progress: false

jobs:
  generate-backend-json:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Backend Parser Repo
        uses: actions/checkout@v4

      - name: Setup Java 21 (with Maven Cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Prepare Unified Output Directory
        run: mkdir -p output

      # ==========================================
      # 1. PUBLIC SWAGGER PARSER
      # ==========================================
      - name: Build & Run api-documentation-generator
        working-directory: ./api-documentation-generator
        env:
          PUBLIC_SWAGGER_URL: ${{ vars.PUBLIC_SWAGGER_URL }}
          PUBLIC_SWAGGER_BODY: ${{ secrets.PUBLIC_SWAGGER_BODY }}
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

          # App ko background mein start karo (port 8080)
          java -jar target/*.jar --server.port=8080 > /tmp/api-doc-gen.log 2>&1 &
          APP_PID=$!

          # Wait jab tak server port 8080 par ready na ho jaye (max 60s)
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080 >/dev/null 2>&1; then
              echo "api-documentation-generator is up!"
              break
            fi
            sleep 2
          done

          # TODO: Yahan exact endpoint aur request body update kar dena
          curl -f --max-time 180 -X POST "http://localhost:8080/api/generate" \
            -H "Content-Type: application/json" \
            -d "$PUBLIC_SWAGGER_BODY"

          # Server band karo aur generated JSON copy karo
          kill -TERM "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

          mkdir -p ../output/public-swagger
          cp -r generated/*.json ../output/public-swagger/ || true

      # ==========================================
      # 2. LIFERAY API ANALYZER
      # ==========================================
      - name: Build & Run liferay-api-analyzer
        working-directory: ./liferay-api-analyzer
        env:
          LIFERAY_URL: ${{ vars.LIFERAY_URL }}
          LIFERAY_CLIENT_ID: ${{ secrets.LIFERAY_CLIENT_ID }}
          LIFERAY_CLIENT_SECRET: ${{ secrets.LIFERAY_CLIENT_SECRET }}
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

          java -jar target/*.jar --server.port=8080 > /tmp/liferay-analyzer.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:8080 >/dev/null 2>&1; then
              echo "liferay-api-analyzer is up!"
              break
            fi
            sleep 2
          done

          # TODO: Yahan Liferay analyzer ka exact endpoint update kar dena
          curl -f --max-time 180 -X POST "http://localhost:8080/api/liferay/analyze" \
            -H "Content-Type: application/json"

          kill -TERM "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

          mkdir -p ../output/liferay
          cp -r generated/*.json ../output/liferay/ || true

      # ==========================================
      # 3. SOURCE CODE ANALYZER (AZURE CLONE + CLEANUP)
      # ==========================================
      - name: Clone Source Code from Azure DevOps
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_REPO_URL: ${{ vars.AZURE_REPO_URL }} # e.g. dev.azure.com/org/proj/_git/repo
        run: |
          git clone --depth 1 "https://pat:${AZURE_PAT}@${AZURE_REPO_URL}" /tmp/azure-source-code

      - name: Build & Run source-code-analyzer
        working-directory: ./source-code-analyzer
        env:
          SOURCE_CODE_PATH: /tmp/azure-source-code
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

          java -jar target/*.jar --server.port=8080 > /tmp/source-analyzer.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:8080 >/dev/null 2>&1; then
              echo "source-code-analyzer is up!"
              break
            fi
            sleep 2
          done

          # TODO: Yahan source-code-analyzer ka exact endpoint & payload update kar dena
          curl -f --max-time 180 -X POST "http://localhost:8080/api/analyze" \
            -H "Content-Type: application/json" \
            -d '{"path": "/tmp/azure-source-code"}'

          kill -TERM "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

          mkdir -p ../output/source-code
          cp -r generated/*.json ../output/source-code/ || true

      - name: Cleanup Cloned Source Code
        if: always()
        run: rm -rf /tmp/azure-source-code

      # ==========================================
      # 4. NORMALIZE JSON, SHA-256 & PUSH TO CENTRAL HUB
      # ==========================================
      - name: Normalize JSON, Compare SHA-256 & Push to Central Docs Repo
        id: push_data
        run: |
          git clone https://x-access-token:${{ secrets.CENTRAL_REPO_PAT }}@github.com/harshh122/central-docs-hub.git central-docs
          mkdir -p central-docs/backend

          find output -type f -name "*.json" | while read -r file; do
            rel_path="${file#output/}"
            dest="central-docs/backend/$rel_path"
            mkdir -p "$(dirname "$dest")"

            jq -S -c . "$file" > /tmp/normalized.json
            new_hash=$(sha256sum /tmp/normalized.json | awk '{print $1}')
            old_hash=$([ -f "$dest" ] && sha256sum "$dest" | awk '{print $1}' || echo "")

            if [ "$new_hash" = "$old_hash" ]; then
              echo "Skipping unchanged JSON (SHA-256 match): $rel_path"
            else
              echo "Updating JSON (SHA-256 changed): $rel_path"
              cp /tmp/normalized.json "$dest"
            fi
          done
          rm -f /tmp/normalized.json

          cd central-docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend

          if git diff --staged --quiet; then
            echo "No changes for backend."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update backend JSON docs"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================
      # 5. TRIGGER PIPELINE 3
      # ==========================================
      - name: Trigger Central Hub (Pipeline 3)
        if: steps.push_data.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CENTRAL_REPO_PAT }}
          repository: harshh122/central-docs-hub
          event-type: json-data-updated
          client-payload: '{"source": "backend"}'
